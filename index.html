<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JaxCaller P2P Rooms</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.85rem 1.5rem;
      background: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    #room-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      background: #1f2937;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 1px;
    }

    #status-pill {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      background: #374151;
      color: #d1d5db;
      font-weight: 500;
    }

    #status-pill.live {
      background: #064e3b;
      color: #34d399;
    }

    main {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Video Grid (Full Mesh) */
    #gridContainer {
      flex: 1;
      display: grid;
      gap: 12px;
      padding: 16px;
      background: #030712;
      align-content: center;
      justify-content: center;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      overflow-y: auto;
    }

    .tile {
      position: relative;
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1f2937;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }

    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tile.self video {
      transform: scaleX(-1);
    }

    .tile .badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #e2e8f0;
    }

    /* Modals & Overlays */
    .overlay-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 1rem;
    }

    .overlay-backdrop.hidden {
      display: none;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 1.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .card p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1.25rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 0.4rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.7rem 0.85rem;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #030712;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .btn {
      padding: 0.7rem 1.1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }

    .btn-secondary {
      background: #1f2937;
      color: #f1f5f9;
      border: 1px solid #374151;
    }
    .btn-secondary:hover {
      background: #374151;
    }

    .room-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1.25rem 0 0.5rem 0;
    }

    .room-list {
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #1f2937;
      border-radius: 8px;
      background: #0b0f19;
    }

    .room-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid #1f2937;
    }

    .room-item:last-child {
      border-bottom: none;
    }

    .room-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .room-meta {
      font-size: 0.75rem;
      color: #64748b;
    }

    .empty-state {
      padding: 1.5rem;
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
    }

    /* Controls Bar */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      background: #111827;
      border-top: 1px solid #1f2937;
    }

    .control-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: #1f2937;
      color: #f1f5f9;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .control-btn:hover {
      background: #374151;
    }

    .control-btn.active-off {
      background: #dc2626;
      color: white;
    }

    .control-btn.danger {
      background: #b91c1c;
      color: white;
    }
    .control-btn.danger:hover {
      background: #991b1b;
    }
  </style>
</head>
<body>

  <header>
    <h1>JaxCaller <span>Mesh</span></h1>
    <div class="header-meta">
      <span id="room-badge">LOBBY</span>
      <span id="status-pill">Ready</span>
    </div>
  </header>

  <main>
    <div id="gridContainer">
      <div class="tile self" id="selfTile">
        <video id="localVideo" autoplay playsinline muted></video>
        <span class="badge" id="selfLabel">You (Connecting...)</span>
      </div>
    </div>

    <!-- Join / Create Overlay -->
    <div class="overlay-backdrop" id="lobbyModal">
      <div class="card">
        <h2>Enter JaxCaller</h2>
        <p>Talk with multiple friends peer-to-peer using WebRTC mesh.</p>

        <div class="form-group">
          <label>Your Display Name</label>
          <input type="text" id="userNameInput" placeholder="Name or alias" maxlength="16" value="Guest" />
        </div>

        <div class="form-group">
          <label>Create or Join by Name / Code</label>
          <div class="input-row">
            <input type="text" id="roomInput" placeholder="e.g. Lounge, Gaming" maxlength="20" />
            <button class="btn btn-primary" id="btnEnter">Go</button>
          </div>
        </div>

        <div class="room-list-header">
          <label style="margin: 0;">Public Rooms</label>
          <span style="font-size: 0.7rem; color: #64748b;" id="refreshIndicator">Live</span>
        </div>
        <div class="room-list" id="roomList">
          <div class="empty-state">No active rooms found. Type a room name above to start one!</div>
        </div>
      </div>
    </div>
  </main>

  <div class="controls">
    <button class="control-btn" id="toggleMic" title="Toggle Mic">🎤</button>
    <button class="control-btn" id="toggleCam" title="Toggle Camera">📹</button>
    <button class="control-btn" id="btnCopyInvite" title="Copy Room Name">📋</button>
    <button class="control-btn danger" id="btnLeave" title="Leave Room">✕</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { 
      getDatabase, ref, set, get, onValue, push, remove, onDisconnect, child 
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA_HdDmUHYExam_H0BC5wMAy3ZF8B_zVks",
      authDomain: "jaxcaller-75ff6.firebaseapp.com",
      databaseURL: "https://jaxcaller-75ff6-default-rtdb.firebaseio.com",
      projectId: "jaxcaller-75ff6",
      storageBucket: "jaxcaller-75ff6.firebasestorage.app",
      messagingSenderId: "979747955939",
      appId: "1:979747955939:web:b9c3029943df65e0cf11d6",
      measurementId: "G-ZQX27C95GB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    const myPeerId = "peer_" + Math.random().toString(36).substring(2, 9);
    let myUserName = "Guest";
    let activeRoomId = null;
    let localStream = null;

    // Multi-peer tracking: peerId -> { pc, iceCandidatesQueue }
    const peers = new Map();

    const localVideo = document.getElementById("localVideo");
    const gridContainer = document.getElementById("gridContainer");
    const lobbyModal = document.getElementById("lobbyModal");
    const statusPill = document.getElementById("status-pill");
    const roomBadge = document.getElementById("room-badge");
    const selfLabel = document.getElementById("selfLabel");
    const roomList = document.getElementById("roomList");
    const roomInput = document.getElementById("roomInput");
    const userNameInput = document.getElementById("userNameInput");

    function setStatus(text, isLive = false) {
      statusPill.textContent = text;
      statusPill.className = isLive ? "live" : "";
    }

    // 1. Initialize Media Hardware
    async function setupLocalStream() {
      if (!localStream) {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: { echoCancellation: true, noiseSuppression: true }
        });
        localVideo.srcObject = localStream;
      }
    }

    // 2. Public Rooms Directory Listener
    const publicRoomsRef = ref(db, "public_rooms");
    onValue(publicRoomsRef, (snapshot) => {
      const data = snapshot.val();
      roomList.innerHTML = "";
      if (!data) {
        roomList.innerHTML = `<div class="empty-state">No active rooms found. Type a room name above to start one!</div>`;
        return;
      }

      Object.entries(data).forEach(([key, info]) => {
        const div = document.createElement("div");
        div.className = "room-item";
        div.innerHTML = `
          <div>
            <div class="room-name">${info.name || key}</div>
            <div class="room-meta">${info.count || 1} participant(s)</div>
          </div>
          <button class="btn btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;">Join</button>
        `;
        div.querySelector("button").onclick = () => joinRoom(key, info.name || key);
        roomList.appendChild(div);
      });
    });

    // 3. Peer Connection Factory
    function createPeerConnection(targetPeerId, targetName) {
      const pc = new RTCPeerConnection(rtcConfig);
      const peerData = { pc, queue: [], isConnected: false };
      peers.set(targetPeerId, peerData);

      // Add local tracks
      if (localStream) {
        localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));
      }

      // Buffer or stream remote tracks
      pc.ontrack = (event) => {
        let tile = document.getElementById(`tile_${targetPeerId}`);
        if (!tile) {
          tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `tile_${targetPeerId}`;
          tile.innerHTML = `
            <video autoplay playsinline></video>
            <span class="badge">${targetName || "Friend"}</span>
          `;
          gridContainer.appendChild(tile);
        }
        tile.querySelector("video").srcObject = event.streams[0];
      };

      // Push ICE candidates targeted to peer
      pc.onicecandidate = (event) => {
        if (event.candidate && activeRoomId) {
          const candRef = ref(db, `rooms/${activeRoomId}/signals/${targetPeerId}/${myPeerId}/candidates`);
          push(candRef, event.candidate.toJSON());
        }
      };

      pc.onconnectionstatechange = () => {
        if (["disconnected", "failed", "closed"].includes(pc.connectionState)) {
          removePeer(targetPeerId);
        }
      };

      return peerData;
    }

    function removePeer(peerId) {
      const p = peers.get(peerId);
      if (p) {
        p.pc.close();
        peers.delete(peerId);
      }
      const tile = document.getElementById(`tile_${peerId}`);
      if (tile) tile.remove();
    }

    // Process queued candidates once setRemoteDescription is active
    async function flushCandidateQueue(peerData) {
      while (peerData.queue.length > 0) {
        const cand = peerData.queue.shift();
        try {
          await peerData.pc.addIceCandidate(new RTCIceCandidate(cand));
        } catch (e) {
          console.warn("ICE error", e);
        }
      }
    }

    // 4. Join / Mesh Orchestration
    async function joinRoom(rawRoomId, displayTitle) {
      const sanitizedRoomId = rawRoomId.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");
      if (!sanitizedRoomId) return alert("Please enter a valid room name.");

      myUserName = userNameInput.value.trim() || "Guest";
      activeRoomId = sanitizedRoomId;

      try {
        await setupLocalStream();
      } catch (err) {
        alert("Camera and Microphone permissions are required to enter.");
        return;
      }

      lobbyModal.classList.add("hidden");
      roomBadge.textContent = displayTitle.toUpperCase();
      selfLabel.textContent = `${myUserName} (You)`;
      setStatus("Connecting...", false);

      const roomPeersRef = ref(db, `rooms/${activeRoomId}/peers`);
      const myPeerRef = child(roomPeersRef, myPeerId);
      const publicRoomRef = ref(db, `public_rooms/${activeRoomId}`);

      // 1. Get existing peers first (to avoid self-signaling collisions)
      const currentPeersSnap = await get(roomPeersRef);
      const currentPeers = currentPeersSnap.val() || {};

      // 2. Register myself in the room
      await set(myPeerRef, { name: myUserName, joinedAt: Date.now() });
      onDisconnect(myPeerRef).remove();

      // Update room directory count on join/leave
      await set(publicRoomRef, {
        name: displayTitle,
        count: Object.keys(currentPeers).length + 1
      });
      onDisconnect(publicRoomRef).remove();

      // 3. As the NEW JOINER, initiate offer to ALL existing peers
      for (const [existingPeerId, existingInfo] of Object.entries(currentPeers)) {
        if (existingPeerId === myPeerId) continue;

        const peerData = createPeerConnection(existingPeerId, existingInfo.name);
        const offer = await peerData.pc.createOffer();
        await peerData.pc.setLocalDescription(offer);

        // Put offer into signaling inbox of target peer
        const offerRef = ref(db, `rooms/${activeRoomId}/signals/${existingPeerId}/${myPeerId}/offer`);
        await set(offerRef, {
          type: offer.type,
          sdp: offer.sdp,
          senderName: myUserName
        });
      }

      // 4. Listen for peers leaving
      onValue(roomPeersRef, (snap) => {
        const val = snap.val() || {};
        peers.forEach((_, id) => {
          if (!val[id]) removePeer(id);
        });
        // Update live directory count
        set(publicRoomRef, { name: displayTitle, count: Object.keys(val).length });
      });

      // 5. Listen to my personal signaling inbox: signals/{myPeerId}/*
      const myInboxRef = ref(db, `rooms/${activeRoomId}/signals/${myPeerId}`);
      onValue(myInboxRef, async (snap) => {
        const inboxes = snap.val() || {};

        for (const [fromPeerId, signalData] of Object.entries(inboxes)) {
          let peerData = peers.get(fromPeerId);

          // Handle incoming Offer (from a newer peer)
          if (signalData.offer) {
            if (!peerData) {
              peerData = createPeerConnection(fromPeerId, signalData.offer.senderName);
            }
            if (peerData.pc.signalingState !== "stable") {
              await Promise.all([
                peerData.pc.setLocalDescription({ type: "rollback" }),
                peerData.pc.setRemoteDescription(new RTCSessionDescription(signalData.offer))
              ]);
            } else {
              await peerData.pc.setRemoteDescription(new RTCSessionDescription(signalData.offer));
            }

            await flushCandidateQueue(peerData);

            // Respond with Answer
            const answer = await peerData.pc.createAnswer();
            await peerData.pc.setLocalDescription(answer);

            await set(ref(db, `rooms/${activeRoomId}/signals/${fromPeerId}/${myPeerId}/answer`), {
              type: answer.type,
              sdp: answer.sdp
            });

            // Clean consumed offer
            remove(ref(db, `rooms/${activeRoomId}/signals/${myPeerId}/${fromPeerId}/offer`));
          }

          // Handle incoming Answer
          if (signalData.answer && peerData) {
            if (peerData.pc.signalingState === "have-local-offer") {
              await peerData.pc.setRemoteDescription(new RTCSessionDescription(signalData.answer));
              await flushCandidateQueue(peerData);
            }
            remove(ref(db, `rooms/${activeRoomId}/signals/${myPeerId}/${fromPeerId}/answer`));
          }

          // Handle incoming ICE candidates
          if (signalData.candidates) {
            Object.entries(signalData.candidates).forEach(([candKey, candVal]) => {
              if (peerData && peerData.pc.remoteDescription) {
                peerData.pc.addIceCandidate(new RTCIceCandidate(candVal)).catch(console.warn);
              } else if (peerData) {
                peerData.queue.push(candVal);
              }
              remove(ref(db, `rooms/${activeRoomId}/signals/${myPeerId}/${fromPeerId}/candidates/${candKey}`));
            });
          }
        }
      });

      setStatus("In Room", true);
    }

    // 5. Leave & Clean Up
    function leaveRoom() {
      if (activeRoomId) {
        remove(ref(db, `rooms/${activeRoomId}/peers/${myPeerId}`));
        remove(ref(db, `rooms/${activeRoomId}/signals/${myPeerId}`));
        peers.forEach((_, id) => removePeer(id));
        activeRoomId = null;
      }

      roomBadge.textContent = "LOBBY";
      setStatus("Ready", false);
      lobbyModal.classList.remove("hidden");
    }

    document.getElementById("btnEnter").onclick = () => {
      const room = roomInput.value.trim();
      if (!room) return alert("Please enter a room name.");
      joinRoom(room, room);
    };

    document.getElementById("btnLeave").onclick = leaveRoom;

    document.getElementById("btnCopyInvite").onclick = () => {
      if (!activeRoomId) return alert("Join a room first!");
      navigator.clipboard.writeText(activeRoomId);
      alert(`Room name "${activeRoomId}" copied to clipboard! Share it with your friends.`);
    };

    // 6. Media Toggles
    const toggleMicBtn = document.getElementById("toggleMic");
    toggleMicBtn.onclick = () => {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        toggleMicBtn.classList.toggle("active-off", !audioTrack.enabled);
