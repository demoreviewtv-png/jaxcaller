<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JaxCaller Mesh</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 0.75rem 1rem;
      background: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      z-index: 20;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #room-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      background: #1f2937;
      color: #38bdf8;
      font-weight: 600;
    }

    #status-pill {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      background: #374151;
      color: #d1d5db;
    }

    #status-pill.live {
      background: #064e3b;
      color: #34d399;
    }

    .app-body {
      flex: 1;
      display: flex;
      position: relative;
      height: calc(100vh - 120px);
      overflow: hidden;
    }

    #gridContainer {
      flex: 1;
      display: grid;
      gap: 8px;
      padding: 8px;
      background: #030712;
      align-content: center;
      justify-content: center;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      overflow-y: auto;
    }

    .tile {
      position: relative;
      background: #111827;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1f2937;
    }

    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tile.self:not(.screen-sharing) video {
      transform: scaleX(-1);
    }

    .tile .badge {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    #chatPanel {
      width: 280px;
      background: #111827;
      border-left: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
    }

    #chatPanel.hidden-chat {
      display: none;
    }

    .chat-header {
      padding: 0.65rem 0.85rem;
      background: #1e293b;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #chatMessages {
      flex: 1;
      padding: 0.75rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .msg {
      background: #1f2937;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .msg.self-msg {
      background: #0369a1;
      align-self: flex-end;
    }

    .chat-input-bar {
      padding: 0.5rem;
      border-top: 1px solid #1f2937;
      display: flex;
      gap: 0.4rem;
      background: #0f172a;
    }

    .chat-input-bar input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
    }

    /* Modal */
    .overlay-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .overlay-backdrop.hidden {
      display: none !important;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 1.25rem;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .card h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .card p {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 1rem;
    }

    .error-banner {
      display: none;
      background: #7f1d1d;
      color: #fecaca;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 0.85rem;
    }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 0.35rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #030712;
      color: #f8fafc;
      font-size: 0.9rem;
      outline: none;
    }

    .btn {
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: #0284c7;
      color: white;
    }

    .default-rooms-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 0.4rem;
    }

    .default-room-btn {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 0.6rem 0.7rem;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls {
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
      background: #111827;
      border-top: 1px solid #1f2937;
      z-index: 20;
    }

    .control-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #1f2937;
      color: #f1f5f9;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn.active-off {
      background: #dc2626;
      color: white;
    }

    .control-btn.active-on {
      background: #0284c7;
      color: white;
    }

    .control-btn.danger {
      background: #b91c1c;
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <h1>JaxCaller <span>Mesh</span></h1>
    <div class="header-meta">
      <span id="room-badge">LOBBY</span>
      <span id="status-pill">Ready</span>
    </div>
  </header>

  <div class="app-body">
    <div id="gridContainer">
      <div class="tile self" id="selfTile">
        <video id="localVideo" autoplay playsinline muted></video>
        <span class="badge" id="selfLabel">You (Standby)</span>
      </div>
    </div>

    <div id="chatPanel" class="hidden-chat">
      <div class="chat-header">
        <span>Room Chat</span>
        <button class="btn" id="btnCloseChat" style="background:#334155;color:white;padding:2px 6px;font-size:0.75rem;">✕</button>
      </div>
      <div id="chatMessages"></div>
      <div class="chat-input-bar">
        <input type="text" id="chatInput" placeholder="Message..." maxlength="200" />
        <button class="btn btn-primary" id="btnSendChat" type="button">Send</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn" id="toggleMic" type="button">🎤</button>
    <button class="control-btn" id="toggleCam" type="button">📹</button>
    <button class="control-btn" id="toggleScreen" type="button">💻</button>
    <button class="control-btn" id="toggleChat" type="button">💬</button>
    <button class="control-btn" id="btnCopyInvite" type="button">📋</button>
    <button class="control-btn danger" id="btnLeave" type="button">✕</button>
  </div>

  <div class="overlay-backdrop" id="lobbyModal">
    <div class="card">
      <h2>JaxCaller Channels</h2>
      <p>Pick one of the 10 permanent rooms or create a custom room.</p>
      
      <div class="error-banner" id="errorBanner"></div>

      <div class="form-group">
        <label>Display Name</label>
        <input type="text" id="userNameInput" maxlength="16" value="Benny" />
      </div>

      <div class="form-group">
        <label>Join or Create Custom Room</label>
        <div class="input-row">
          <input type="text" id="customRoomInput" placeholder="Room name or code" maxlength="24" value="Happyness" />
          <button class="btn btn-primary" id="btnCustomGo" type="button">Join</button>
        </div>
      </div>

      <div class="form-group" style="margin-top: 1rem;">
        <label>10 Always-Open Public Channels</label>
        <div class="default-rooms-grid" id="defaultRoomsList">
          <!-- Statically rendered fallback to ensure immediate availability -->
          <button class="default-room-btn" type="button" data-room="lounge">☕ Lounge</button>
          <button class="default-room-btn" type="button" data-room="gaming">🎮 Gaming</button>
          <button class="default-room-btn" type="button" data-room="music-beats">🎧 Music</button>
          <button class="default-room-btn" type="button" data-room="coding">💻 Coding</button>
          <button class="default-room-btn" type="button" data-room="study-chill">📚 Study</button>
          <button class="default-room-btn" type="button" data-room="watch-party">🍿 Watch</button>
          <button class="default-room-btn" type="button" data-room="general-1">💬 General 1</button>
          <button class="default-room-btn" type="button" data-room="general-2">💬 General 2</button>
          <button class="default-room-btn" type="button" data-room="tech-talk">⚡ Tech</button>
          <button class="default-room-btn" type="button" data-room="voice-only">🎙️ Voice</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { 
      getDatabase, ref, set, get, onValue, push, remove, onDisconnect, child 
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA_HdDmUHYExam_H0BC5wMAy3ZF8B_zVks",
      authDomain: "jaxcaller-75ff6.firebaseapp.com",
      databaseURL: "https://jaxcaller-75ff6-default-rtdb.firebaseio.com",
      projectId: "jaxcaller-75ff6",
      storageBucket: "jaxcaller-75ff6.firebasestorage.app",
      messagingSenderId: "979747955939",
      appId: "1:979747955939:web:b9c3029943df65e0cf11d6",
      measurementId: "G-ZQX27C95GB"
    };

    let db;
    const errorBanner = document.getElementById("errorBanner");
    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = "block";
    }

    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch (e) {
      showError("Firebase init error: " + e.message);
    }

    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    const myPeerId = "p_" + Math.random().toString(36).substring(2, 9);
    let myUserName = "Benny";
    let activeRoomId = null;
    let localStream = null;
    let screenStream = null;
    let isScreenSharing = false;

    const peers = new Map();

    const localVideo = document.getElementById("localVideo");
    const gridContainer = document.getElementById("gridContainer");
    const lobbyModal = document.getElementById("lobbyModal");
    const statusPill = document.getElementById("status-pill");
    const roomBadge = document.getElementById("room-badge");
    const selfLabel = document.getElementById("selfLabel");
    const selfTile = document.getElementById("selfTile");
    const userNameInput = document.getElementById("userNameInput");
    const customRoomInput = document.getElementById("customRoomInput");
    const btnCustomGo = document.getElementById("btnCustomGo");
    const chatPanel = document.getElementById("chatPanel");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const btnSendChat = document.getElementById("btnSendChat");
    const toggleChatBtn = document.getElementById("toggleChat");
    const toggleScreenBtn = document.getElementById("toggleScreen");

    function setStatus(text, isLive = false) {
      statusPill.textContent = text;
      statusPill.className = isLive ? "live" : "";
    }

    // Static Room button click bindings
    document.querySelectorAll(".default-room-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const roomId = btn.getAttribute("data-room");
        joinRoom(roomId, btn.textContent.trim());
      });
    });

    function createFallbackStream() {
      const canvas = document.createElement("canvas");
      canvas.width = 320;
      canvas.height = 240;
      const ctx = canvas.getContext("2d");
      let pulse = 0;

      setInterval(() => {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, 320, 240);
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(160, 110, 35 + Math.sin(pulse) * 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(myUserName, 160, 180);
        pulse += 0.1;
      }, 50);

      const stream = canvas.captureStream(20);
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const dst = osc.connect(audioCtx.createMediaStreamDestination());
        osc.start();
        const audioTrack = dst.stream.getAudioTracks()[0];
        audioTrack.enabled = false;
        stream.addTrack(audioTrack);
      } catch (err) {}
      return stream;
    }

    async function ensureMediaStream() {
      if (localStream) return;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: { echoCancellation: true, noiseSuppression: true }
        });
      } catch (e) {
        console.warn("Using fallback canvas stream:", e);
        localStream = createFallbackStream();
      }
      localVideo.srcObject = localStream;
    }

    function setupPeerConnection(targetPeerId, targetName) {
      const pc = new RTCPeerConnection(rtcConfig);
      const polite = myPeerId < targetPeerId;
      const peerData = { pc, polite, queue: [], makingOffer: false };
      peers.set(targetPeerId, peerData);

      const streamToSend = isScreenSharing && screenStream ? screenStream : localStream;
      if (streamToSend) {
        streamToSend.getTracks().forEach((track) => pc.addTrack(track, streamToSend));
      }

      pc.ontrack = (event) => {
        let tile = document.getElementById(`tile_${targetPeerId}`);
        if (!tile) {
          tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `tile_${targetPeerId}`;
          tile.innerHTML = `
            <video autoplay playsinline></video>
            <span class="badge">${targetName || "Peer"}</span>
          `;
          gridContainer.appendChild(tile);
        }
        tile.querySelector("video").srcObject = event.streams[0];
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && activeRoomId) {
          push(ref(db, `rooms/${activeRoomId}/signals/${targetPeerId}/${myPeerId}/candidates`), event.candidate.toJSON());
        }
      };

      pc.onconnectionstatechange = () => {
        if (["disconnected", "failed", "closed"].includes(pc.connectionState)) {
          removePeer(targetPeerId);
        }
      };

      return peerData;
    }

    function removePeer(peerId) {
      const p = peers.get(peerId);
      if (p) {
        p.pc.close();
        peers.delete(peerId);
      }
      const tile = document.getElementById(`tile_${peerId}`);
      if (tile) tile.remove();
    }

    async function drainIceCandidates(peerData) {
      while (peerData.queue.length > 0) {
        const cand = peerData.queue.shift();
        try {
          await peerData.pc.addIceCandidate(new RTCIceCandidate(cand));
        } catch (err) {}
      }
    }

    async function joinRoom(roomId, roomTitle) {
      myUserName = userNameInput.value.trim() || "Benny";
      activeRoomId = roomId.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");

      if (!activeRoomId) {
        showError("Invalid room name. Use letters and numbers only.");
        return;
      }

      btnCustomGo.disabled = true;
      btnCustomGo.textContent = "...";

      try {
        await ensureMediaStream();

        lobbyModal.classList.add("hidden");
        roomBadge.textContent = roomTitle.toUpperCase();
        selfLabel.textContent = `${myUserName} (You)`;
        setStatus("Connected", true);

        const roomPeersRef = ref(db, `rooms/${activeRoomId}/peers`);
        const myPeerRef = child(roomPeersRef, myPeerId);

        // Join room
        await set(myPeerRef, { name: myUserName, joinedAt: Date.now() });
        onDisconnect(myPeerRef).remove();

        // Query existing peers
        const snap = await get(roomPeersRef);
        const existing = snap.val() || {};

        for (const [peerId, peerInfo] of Object.entries(existing)) {
          if (peerId === myPeerId) continue;

          const peerData = setupPeerConnection(peerId, peerInfo.name);
          try {
            peerData.makingOffer = true;
            const offer = await peerData.pc.createOffer();
            await peerData.pc.setLocalDescription(offer);

            await set(ref(db, `rooms/${activeRoomId}/signals/${peerId}/${myPeerId}/offer`), {
              type: offer.type,
              sdp: offer.sdp,
              senderName: myUserName
            });
          } finally {
            peerData.makingOffer = false;
          }
        }

        onValue(roomPeersRef, (snap) => {
          const current = snap.val() || {};
          peers.forEach((_, id) => {
            if (!current[id]) removePeer(id);
          });
        });

        // Signals inbox listener
        const mySignalsRef = ref(db, `rooms/${activeRoomId}/signals/${myPeerId}`);
        onValue(mySignalsRef, async (snap) => {
          const signals = snap.val() || {};

          for (const [senderId, data] of Object.entries(signals)) {
            let peerData = peers.get(senderId);

            if (data.offer) {
              if (!peerData) {
                peerData = setupPeerConnection(senderId, data.offer.senderName);
              }

              const offerCollision = peerData.makingOffer || peerData.pc.signalingState !== "stable";
              if (offerCollision && !peerData.polite) {
                remove(ref(db, `rooms/${activeRoomId}/signals/${myPeerId}/${senderId}/offer`));
                continue;
              }

              if (offerCollision && peerData.polite) {
                await peerData.pc.setLocalDescription({ type: "rollback" });
              }

              await peerData.pc.setRemoteDescription(new RTCSessionDescription(data.offer));
              await drainIceCandidates(peerData);

              const answer = await peerData.pc.createAnswer();
              await peerData.pc.setLocalDescription(answer);

              await set(ref(db, `rooms/${activeRoomId}/signals/${senderId}/${myPeerId}/answer`), {
                type: answer.type,
                sdp: answer.sdp
              });

              remove(ref(db, `rooms/${activeRoomId}/signa
