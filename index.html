<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JaxCaller Mesh & Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 0.75rem 1.25rem;
      background: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      z-index: 20;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    #room-badge {
      font-size: 0.75rem;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      background: #1f2937;
      color: #38bdf8;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #status-pill {
      font-size: 0.75rem;
      padding: 0.3rem 0.65rem;
      border-radius: 9999px;
      background: #374151;
      color: #d1d5db;
      font-weight: 500;
    }

    #status-pill.live {
      background: #064e3b;
      color: #34d399;
    }

    /* Main Workspace Layout */
    .app-body {
      flex: 1;
      display: flex;
      position: relative;
      height: calc(100vh - 120px);
      overflow: hidden;
    }

    /* Video Grid (Responsive Mesh) */
    #gridContainer {
      flex: 1;
      display: grid;
      gap: 10px;
      padding: 12px;
      background: #030712;
      align-content: center;
      justify-content: center;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      overflow-y: auto;
    }

    .tile {
      position: relative;
      background: #111827;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1f2937;
    }

    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tile.self:not(.screen-sharing) video {
      transform: scaleX(-1);
    }

    .tile .badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    /* Chat Drawer */
    #chatPanel {
      width: 320px;
      background: #111827;
      border-left: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    #chatPanel.hidden-chat {
      display: none;
    }

    .chat-header {
      padding: 0.75rem 1rem;
      background: #1e293b;
      font-size: 0.85rem;
      font-weight: 700;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #chatMessages {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .msg {
      background: #1f2937;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      word-break: break-word;
    }

    .msg .sender {
      font-size: 0.7rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 2px;
    }

    .msg.self-msg {
      background: #0369a1;
      align-self: flex-end;
    }

    .msg.self-msg .sender {
      color: #e0f2fe;
    }

    .chat-input-bar {
      padding: 0.75rem;
      border-top: 1px solid #1f2937;
      display: flex;
      gap: 0.5rem;
      background: #0f172a;
    }

    .chat-input-bar input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    /* Lobby Modal Overlay */
    .overlay-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .overlay-backdrop.hidden {
      display: none !important;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 1.5rem;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
      max-height: 90vh;
      overflow-y: auto;
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .card p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1.25rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 0.4rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #030712;
      color: #f8fafc;
      font-size: 0.9rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .btn {
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }

    .btn-secondary {
      background: #1f2937;
      color: #f1f5f9;
      border: 1px solid #374151;
    }
    .btn-secondary:hover {
      background: #374151;
    }

    /* 10 Default Channels Grid */
    .default-rooms-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 0.5rem;
    }

    .default-room-btn {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .default-room-btn:hover {
      background: #1e293b;
      border-color: #38bdf8;
    }

    .room-count-tag {
      font-size: 0.7rem;
      background: #1e293b;
      color: #94a3b8;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Footer Controls */
    .controls {
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      background: #111827;
      border-top: 1px solid #1f2937;
      z-index: 20;
    }

    .control-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #1f2937;
      color: #f1f5f9;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .control-btn:hover {
      background: #374151;
    }

    .control-btn.active-off {
      background: #dc2626;
      color: white;
    }

    .control-btn.active-on {
      background: #0284c7;
      color: white;
    }

    .control-btn.danger {
      background: #b91c1c;
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <h1>JaxCaller <span>Mesh</span></h1>
    <div class="header-meta">
      <span id="room-badge">LOBBY</span>
      <span id="status-pill">Ready</span>
    </div>
  </header>

  <div class="app-body">
    <!-- Video Mesh Grid -->
    <div id="gridContainer">
      <div class="tile self" id="selfTile">
        <video id="localVideo" autoplay playsinline muted></video>
        <span class="badge" id="selfLabel">You (Standby)</span>
      </div>
    </div>

    <!-- Text Chat Sidebar -->
    <div id="chatPanel" class="hidden-chat">
      <div class="chat-header">
        <span>Room Chat</span>
        <button class="btn btn-secondary" id="btnCloseChat" style="padding: 2px 6px; font-size: 0.75rem;">✕</button>
      </div>
      <div id="chatMessages"></div>
      <div class="chat-input-bar">
        <input type="text" id="chatInput" placeholder="Type a message..." maxlength="200" />
        <button class="btn btn-primary" id="btnSendChat" type="button">Send</button>
      </div>
    </div>
  </div>

  <!-- Bottom Control Bar -->
  <div class="controls">
    <button class="control-btn" id="toggleMic" title="Toggle Mic" type="button">🎤</button>
    <button class="control-btn" id="toggleCam" title="Toggle Camera" type="button">📹</button>
    <button class="control-btn" id="toggleScreen" title="Share Screen" type="button">💻</button>
    <button class="control-btn" id="toggleChat" title="Chat" type="button">💬</button>
    <button class="control-btn" id="btnCopyInvite" title="Copy Room ID" type="button">📋</button>
    <button class="control-btn danger" id="btnLeave" title="Leave Room" type="button">✕</button>
  </div>

  <!-- Join / Channel Select Modal -->
  <div class="overlay-backdrop" id="lobbyModal">
    <div class="card">
      <h2>JaxCaller Channels</h2>
      <p>Pick one of the 10 permanent rooms or create your own custom room.</p>

      <div class="form-group">
        <label>Your Display Name</label>
        <input type="text" id="userNameInput" placeholder="Your name or handle" maxlength="16" value="Benny" />
      </div>

      <div class="form-group">
        <label>Join or Create Custom Room</label>
        <div class="input-row">
          <input type="text" id="customRoomInput" placeholder="Room name or code" maxlength="24" />
          <button class="btn btn-primary" id="btnCustomGo" type="button">Join</button>
        </div>
      </div>

      <div class="form-group" style="margin-top: 1.25rem;">
        <label>10 Always-Open Public Channels</label>
        <div class="default-rooms-grid" id="defaultRoomsList">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { 
      getDatabase, ref, set, get, onValue, push, remove, onDisconnect, child, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA_HdDmUHYExam_H0BC5wMAy3ZF8B_zVks",
      authDomain: "jaxcaller-75ff6.firebaseapp.com",
      databaseURL: "https://jaxcaller-75ff6-default-rtdb.firebaseio.com",
      projectId: "jaxcaller-75ff6",
      storageBucket: "jaxcaller-75ff6.firebasestorage.app",
      messagingSenderId: "979747955939",
      appId: "1:979747955939:web:b9c3029943df65e0cf11d6",
      measurementId: "G-ZQX27C95GB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    // The 10 Permanent Public Channels
    const PERMANENT_ROOMS = [
      { id: "lounge", name: "☕ Lounge" },
      { id: "gaming", name: "🎮 Gaming" },
      { id: "music-beats", name: "🎧 Music & Beats" },
      { id: "coding", name: "💻 Coding Lab" },
      { id: "study-chill", name: "📚 Study Chill" },
      { id: "watch-party", name: "🍿 Watch Party" },
      { id: "general-1", name: "💬 General 1" },
      { id: "general-2", name: "💬 General 2" },
      { id: "tech-talk", name: "⚡ Tech Talk" },
      { id: "voice-only", name: "🎙️ Voice Room" }
    ];

    const myPeerId = "p_" + Math.random().toString(36).substring(2, 9);
    let myUserName = "Benny";
    let activeRoomId = null;
    let localStream = null;
    let screenStream = null;
    let isScreenSharing = false;

    // Peer connections Map: peerId -> { pc, queue, polite }
    const peers = new Map();

    // DOM Elements
    const localVideo = document.getElementById("localVideo");
    const gridContainer = document.getElementById("gridContainer");
    const lobbyModal = document.getElementById("lobbyModal");
    const statusPill = document.getElementById("status-pill");
    const roomBadge = document.getElementById("room-badge");
    const selfLabel = document.getElementById("selfLabel");
    const selfTile = document.getElementById("selfTile");
    const userNameInput = document.getElementById("userNameInput");
    const customRoomInput = document.getElementById("customRoomInput");
    const btnCustomGo = document.getElementById("btnCustomGo");
    const defaultRoomsList = document.getElementById("defaultRoomsList");
    const chatPanel = document.getElementById("chatPanel");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const btnSendChat = document.getElementById("btnSendChat");
    const toggleChatBtn = document.getElementById("toggleChat");
    const toggleScreenBtn = document.getElementById("toggleScreen");

    function setStatus(text, isLive = false) {
      statusPill.textContent = text;
      statusPill.className = isLive ? "live" : "";
    }

    // Render 10 Permanent Channels and monitor active counts
    PERMANENT_ROOMS.forEach(room => {
      const btn = document.createElement("button");
      btn.className = "default-room-btn";
      btn.type = "button";
      btn.innerHTML = `
        <span>${room.name}</span>
        <span class="room-count-tag" id="count_${room.id}">0</span>
      `;
      btn.onclick = () => joinRoom(room.id, room.name);
      defaultRoomsList.appendChild(btn);

      // Listen to peer counts live
      onValue(ref(db, `rooms/${room.id}/peers`), (snap) => {
        const val = snap.val() || {};
        const count = Object.keys(val).length;
        const countEl = document.getElementById(`count_${room.id}`);
        if (countEl) countEl.textContent = count;
      });
    });

    // Fallback Canvas Stream if no physical camera/mic
    function createFallbackStream() {
      const canvas = document.createElement("canvas");
      canvas.width = 640;
      canvas.height = 480;
      const ctx = canvas.getContext("2d");
      let pulse = 0;

      setInterval(() => {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, 640, 480);
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(320, 220, 50 + Math.sin(pulse) * 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 26px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(myUserName, 320, 320);
        pulse += 0.08;
      }, 50);

      const stream = canvas.captureStream(30);
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const dst = osc.connect(audioCtx.createMediaStreamDestination());
      osc.start();
      const audioTrack = dst.stream.getAudioTracks()[0];
      audioTrack.enabled = false;
      stream.addTrack(audioTrack);
      return stream;
    }

    async function ensureMediaStream() {
      if (localStream) return;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: { echoCancellation: true, noiseSuppression: true }
        });
      } catch (e) {
        console.warn("Using fallback canvas stream:", e);
        localStream = createFallbackStream();
      }
      localVideo.srcObject = localStream;
    }

    // WebRTC Perfect Negotiation Peer Factory
    function setupPeerConnection(targetPeerId, targetName) {
      const pc = new RTCPeerConnection(rtcConfig);
      // Deterministic collision handling: polite if myPeerId < targetPeerId
      const polite = myPeerId < targetPeerId;
      const peerData = { pc, polite, queue: [], makingOffer: false };
      peers.set(targetPeerId, peerData);

      // Attach current local tracks
      const currentStream = isScreenSharing && screenStream ? screenStream : localStream;
      currentStream.getTracks().forEach((track) => pc.addTrack(track, currentStream));

      // Ontrack handler
      pc.ontrack = (event) => {
        let tile = document.getElementById(`tile_${targetPeerId}`);
        if (!tile) {
          tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `tile_${targetPeerId}`;
          tile.innerHTML = `
            <video autoplay playsinline></video>
            <span class="badge">${targetName || "Peer"}</span>
          `;
          gridContainer.appendChild(tile);
        }
        tile.querySelector("video").srcObject = event.streams[0];
      };

      // Push ICE candidate
      pc.onicecandidate = (event) => {
        if (event.candidate && activeRoomId) {
          push(ref(db, `rooms/${activeRoomId}/signals/${targetPeerId}/${myPeerId}/candidates`), event.candidate.toJSON());
        }
      };

      pc.onconnectionstatechange = () => {
        if (["disconnected", "failed", "closed"].includes(pc.connectionState)) {
          removePeer(targetPeerId);
        }
      };

      return peerData;
    }

    function removePeer(peerId) {
      const p = peers.get(peerId);
      if (p) {
        p.pc.close();
        peers.delete(peerId);
      }
      const tile = document.getElementById(`tile_${peerId}`);
      if (tile) tile.remove();
    }

    async function drainIceCandidates(peerData) {
      while (peerData.queue.length > 0) {
        const cand = peerData.queue.shift();
        try {
          await peerData.pc.addIceCandidate(new RTCIceCandidate(cand));
        } catch (err) {
          console.warn("Candidate drain ignored:", err);
        }
      }
    }

    // Main Join Function
    async function joinRoom(roomId, roomTitle) {
      myUserName = userNameInput.value.trim() || "Benny";
      activeRoomId = roomId.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");

      await ensureMediaStream();

      lobbyModal.classList.add("hidden");
      roomBadge.textContent = roomTitle.toUpperCase();
      selfLabel.textContent = `${myUserName} (You)`;
      setStatus("Connected", true);

      const roomPeersRef = ref(db, `rooms/${activeRoomId}/peers`);
      const myPeerRef = child(roomPeersRef, myPeerId);

      // Register presence in room
      await set(myPeerRef, { name: myUserName, joinedAt: Date.now() });
      onDisconnect(myPeerRef).remove();

      // Read existing participants and create offers
      const snap = await get(roomPeersRef);
      const existing = snap.val() || {};

      for (const [peerId, peerInfo] of Object.entries(existing)) {
        if (peerId === myPeerId) continue;

        const peerData = setupPeerConnection(peerId, peerInfo.name);
        try {
          peerData.makingOffer = true;
          const offer = await peerData.pc.createOffer();
          await peerData.pc.setLocalDescription(offer);

          await set(ref(db, `rooms/${activeRoomId}/signals/${peerId}/${myPeerId}/offer`), {
            type: offer.type,
            sdp: offer.sdp,
            senderName: myUserName
          });
        } finally {
          peerData.makingOffer = false;
        }
      }

      // Track peer entries & leaves
      onValue(roomPeersRef, (snap) => {
        const current = snap.val() || {};
        peers.forEach((_, id) => {
          if (!current[id]) removePeer(id);
        });
      });

      // Listen fo
